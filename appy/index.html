<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Hospital Assistant</title>
    
    <!-- Google Fonts: Inter for modern, legible typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for recognizable icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Manifest for Mobile Installation -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">

    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        medical: {
                            blue: '#0056b3',
                            dark: '#0f172a',
                            light: '#f8fafc',
                            alert: '#dc2626'
                        }
                    },
                    boxShadow: {
                        'card': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
                        'focus': '0 0 0 4px rgba(250, 204, 21, 1)' // Yellow high-contrast focus
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-medical-dark antialiased min-h-screen">
    
    <!-- Top Navigation Bar -->
    <header class="bg-medical-blue text-white p-4 shadow-md sticky top-0 z-50 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-tight"><i class="fa-solid fa-staff-snake mr-2"></i>Hospital Assistant</h1>
        <!-- Audio Settings Quick Access -->
        <button id="nav-btn-audio" class="w-12 h-12 rounded-full border-2 border-white/30 flex items-center justify-center hover:bg-white/10 focus:ring-4 focus:ring-yellow-400 focus:outline-none transition" aria-label="Toggle Voice Guidance" aria-pressed="false">
            <i id="nav-icon-audio" class="fa-solid fa-volume-xmark text-xl"></i>
        </button>
    </header>

    <main id="app-container" class="max-w-xl mx-auto p-4 pb-20 space-y-6 mt-4">

        <!-- =================== VIEW: LOGIN =================== -->
        <section id="v-login" class="view-section active">
            <div class="bg-white rounded-2xl p-6 shadow-card border border-slate-200">
                <h2 class="text-2xl font-extrabold mb-6 text-center text-medical-blue">Welcome to Care</h2>
                
                <div class="space-y-6">
                    <!-- Advanced Accessibility Setup -->
                    <div class="bg-slate-50 p-4 rounded-xl border-2 border-slate-200">
                        <h3 class="font-bold text-lg mb-4"><i class="fa-solid fa-universal-access mr-2 text-medical-blue"></i>Accessibility Setup</h3>
                        
                        <div class="space-y-4">
                            <div>
                                <label for="lang-select" class="block font-semibold mb-2 text-slate-700">Guide Language:</label>
                                <select id="lang-select" class="w-full text-lg p-3 rounded-lg border-2 border-slate-300 focus:border-medical-blue focus:ring-4 focus:ring-yellow-400 outline-none transition font-semibold bg-white cursor-pointer">
                                    <option value="en-US">English</option>
                                    <option value="hi-IN">Hindi</option>
                                    <option value="kn-IN">Kannada</option>
                                </select>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <button type="button" id="btn-toggle-voice" class="p-3 border-2 border-slate-300 rounded-lg font-bold flex flex-col items-center justify-center hover:bg-slate-100 focus:ring-4 focus:ring-yellow-400 transition" aria-pressed="false">
                                    <i class="fa-solid fa-head-side-waveform text-3xl mb-2 text-medical-blue"></i>
                                    <span class="text-sm">Voice Output</span>
                                </button>
                                <button type="button" id="btn-test-vibrate" class="p-3 border-2 border-slate-300 rounded-lg font-bold flex flex-col items-center justify-center hover:bg-slate-100 focus:ring-4 focus:ring-yellow-400 transition" aria-label="Test Device Vibration">
                                    <i class="fa-solid fa-mobile-screen-button text-3xl mb-2 text-medical-blue"></i>
                                    <span class="text-sm">Test Haptics</span>
                                </button>
                                <button type="button" id="btn-toggle-font" class="p-3 border-2 border-slate-300 rounded-lg font-bold flex flex-col items-center justify-center hover:bg-slate-100 focus:ring-4 focus:ring-yellow-400 transition" aria-pressed="false">
                                    <i class="fa-solid fa-text-height text-3xl mb-2 text-medical-blue"></i>
                                    <span class="text-sm">Huge Text</span>
                                </button>
                                <button type="button" id="btn-toggle-contrast" class="p-3 border-2 border-slate-300 rounded-lg font-bold flex flex-col items-center justify-center hover:bg-slate-100 focus:ring-4 focus:ring-yellow-400 transition" aria-pressed="false">
                                    <i class="fa-solid fa-circle-half-stroke text-3xl mb-2 text-medical-blue"></i>
                                    <span class="text-sm">High Contrast</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Login Form -->
                    <div>
                        <label for="patient-id" class="block font-semibold mb-2 text-slate-700 text-lg">Patient ID / Phone Number:</label>
                        <input type="text" id="patient-id" placeholder="e.g. 12345" class="w-full text-xl p-4 rounded-xl border-2 border-slate-300 focus:border-medical-blue focus:ring-4 focus:ring-yellow-400 outline-none transition font-bold" aria-required="true">
                    </div>
                    
                    <button type="button" id="btn-login" class="w-full bg-medical-blue text-white text-xl font-bold py-5 rounded-xl hover:bg-blue-800 focus:ring-4 focus:ring-yellow-400 shadow-lg active:scale-95 transition-all">
                        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Login to Dashboard
                    </button>
                </div>
            </div>
        </section>


        <!-- =================== VIEW: DASHBOARD =================== -->
        <section id="v-dashboard" class="view-section hidden">
            <h2 id="dashboard-greeting" class="text-3xl font-extrabold mb-6 text-center text-medical-blue">Hospital Dashboard</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <!-- Medicines Card -->
                <button type="button" id="btn-nav-medicines" class="action-card bg-white border-2 border-emerald-200 shadow-card hover:shadow-xl focus:ring-4 focus:ring-yellow-400 rounded-2xl p-6 flex flex-col items-center justify-center gap-4 transition-all">
                    <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600">
                        <i class="fa-solid fa-pills text-4xl"></i>
                    </div>
                    <span class="text-lg font-bold text-slate-800">Medicines</span>
                </button>

                <!-- Navigation Card -->
                <button type="button" id="btn-nav-navigation" class="action-card bg-white border-2 border-blue-200 shadow-card hover:shadow-xl focus:ring-4 focus:ring-yellow-400 rounded-2xl p-6 flex flex-col items-center justify-center gap-4 transition-all">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                        <i class="fa-solid fa-map-location-dot text-4xl"></i>
                    </div>
                    <span class="text-lg font-bold text-slate-800">Navigate</span>
                </button>

                <!-- Scan QR Card -->
                <button type="button" id="btn-nav-qr" class="action-card bg-white border-2 border-purple-200 shadow-card hover:shadow-xl focus:ring-4 focus:ring-yellow-400 rounded-2xl col-span-2 p-6 flex items-center justify-center gap-6 transition-all">
                    <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 shrink-0">
                        <i class="fa-solid fa-qrcode text-4xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-xl font-extrabold text-slate-800">Scan QR Code</span>
                        <span class="text-slate-500 font-medium">Read medication & details</span>
                    </div>
                </button>

                <!-- Emergency Card (Massive Target) -->
                <button type="button" id="btn-nav-emergency" class="action-card bg-medical-alert border-4 border-red-800 shadow-card hover:shadow-xl focus:ring-4 focus:ring-yellow-400 rounded-2xl col-span-2 p-8 flex flex-col items-center justify-center gap-4 transition-all group overflow-hidden relative">
                    <!-- Flashing background effect logic in CSS -->
                    <div class="emergency-pulse absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity"></div>
                    <i class="fa-solid fa-truck-medical text-6xl text-white drop-shadow-md"></i>
                    <span class="text-3xl font-black text-white uppercase tracking-wider drop-shadow-md">Emergency</span>
                </button>
            </div>
        </section>

        <!-- =================== VIEW: MY MEDICINES =================== -->
        <section id="v-medicines" class="view-section hidden">
            <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-200 h-full min-h-[70vh] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold text-medical-blue"><i class="fa-solid fa-pills mr-2"></i>My Prescriptions</h2>
                    <button class="btn-back bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-yellow-400 transition">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                </div>
                
                <!-- Injected List -->
                <div id="medicines-list-container" class="space-y-4 flex-grow overflow-y-auto pr-2">
                    <!-- Cards will be generated by JS -->
                </div>
            </div>
        </section>

        <!-- =================== VIEW: SMART QR SCANNER =================== -->
        <section id="v-scanner" class="view-section hidden flex flex-col h-[80vh]">
            <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-200 flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-extrabold text-medical-blue"><i class="fa-solid fa-qrcode mr-2"></i>Scanner</h2>
                    <button class="btn-back bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-yellow-400 transition">
                        <i class="fa-solid fa-xmark"></i> Close
                    </button>
                </div>
                
                <!-- Scanner Viewport -->
                <div id="scanner-wrapper" class="flex-grow flex flex-col">
                    <div class="w-full bg-black rounded-xl overflow-hidden relative border-4 border-slate-800 shadow-inner flex-grow flex items-center justify-center" id="reader-container">
                        <!-- html5-qrcode injects video here -->
                        <div id="reader" class="w-full h-full"></div>
                        <!-- Scanning UI Overlay -->
                        <div class="absolute inset-0 border-[6px] border-medical-blue/50 pointer-events-none rounded-xl m-4 scan-pulse" id="scan-overlay"></div>
                    </div>
                    <p class="text-center font-semibold text-slate-600 mt-4 text-lg">Point your camera at a medicine QR code.</p>
                </div>

                <!-- Scanned Result Card -->
                <div id="scanned-result" class="hidden flex-grow flex flex-col justify-center">
                    
                    <!-- Personalized Alert Box -->
                    <div id="prescription-alert" class="mb-4 p-4 rounded-xl border-4 flex items-center justify-center text-center font-black text-xl transition-colors">
                        <i id="prescription-alert-icon" class="mr-2 text-2xl"></i>
                        <span id="prescription-alert-text">Analyzing Prescription...</span>
                    </div>

                    <div class="bg-slate-50 border-4 border-slate-300 rounded-xl p-6 text-slate-900 shadow-lg mb-6">
                        <div class="flex items-center gap-3 mb-4 border-b-2 border-slate-200 pb-4">
                            <i class="fa-solid fa-pills text-4xl text-medical-blue"></i>
                            <h3 class="text-2xl font-black" id="med-name">Medicine Name</h3>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <strong class="uppercase text-slate-700 text-xs font-bold tracking-wider">Active Contents</strong>
                                <p class="text-lg font-semibold bg-white p-3 rounded-lg border border-slate-200 mt-1" id="med-contents">...</p>
                            </div>
                            <div>
                                <strong class="uppercase text-slate-700 text-xs font-bold tracking-wider">Dosage</strong>
                                <p class="text-xl font-bold bg-white p-3 rounded-lg border border-slate-200 mt-1" id="med-dosage">...</p>
                            </div>
                            <div>
                                <strong class="uppercase text-slate-700 text-xs font-bold tracking-wider">Schedule</strong>
                                <p class="text-lg font-semibold bg-white p-3 rounded-lg border border-slate-200 mt-1" id="med-schedule">...</p>
                            </div>
                            <div class="bg-amber-100 border-l-4 border-amber-500 p-4 rounded-r-lg mt-4">
                                <strong class="uppercase text-amber-800 text-xs font-bold tracking-wider flex items-center"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Warnings</strong>
                                <p class="text-amber-900 font-bold mt-1" id="med-warnings">...</p>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="btn-play-audio" class="w-full bg-medical-blue text-white text-xl font-bold py-5 rounded-xl hover:bg-blue-800 focus:ring-4 focus:ring-yellow-400 shadow-lg active:scale-95 transition flex items-center justify-center gap-3">
                        <i class="fa-solid fa-volume-high text-2xl"></i> Read Info Aloud
                    </button>
                    <button type="button" id="btn-scan-again" class="w-full bg-slate-200 text-slate-800 text-xl font-bold py-4 rounded-xl hover:bg-slate-300 focus:ring-4 focus:ring-yellow-400 mt-4 transition">
                        Scan Another
                    </button>
                </div>
            </div>
        </section>


        <!-- =================== VIEW: NAVIGATION =================== -->
        <section id="v-navigation" class="view-section hidden">
            <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-200 h-full min-h-[70vh] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold text-medical-blue"><i class="fa-solid fa-map mr-2"></i>Navigation</h2>
                    <button class="btn-back bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-yellow-400 transition">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                </div>
                
                <!-- Destination Setup -->
                <div id="nav-setup" class="flex-grow flex flex-col justify-center space-y-6 max-w-sm mx-auto w-full">
                    <label for="nav-destination" class="block font-black text-2xl mb-2 text-center text-slate-800">Where do you want to go?</label>
                    <select id="nav-destination" class="w-full text-2xl p-5 rounded-xl border-4 border-slate-300 focus:border-medical-blue focus:ring-4 focus:ring-yellow-400 outline-none transition font-bold bg-white text-center appearance-none shadow-sm cursor-pointer">
                        <option value="" disabled selected>Select destination...</option>
                        <option value="pharmacy">💊 Pharmacy (1st Floor)</option>
                        <option value="laboratory">🔬 Laboratory (Ground Floor)</option>
                        <option value="reception">👋 Main Reception</option>
                    </select>
                    
                    <button type="button" id="btn-start-nav" class="w-full bg-medical-blue text-white text-2xl font-black py-6 rounded-xl hover:bg-blue-800 focus:ring-4 focus:ring-yellow-400 shadow-xl active:scale-95 transition-all mt-4 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-play"></i> Start Guide
                    </button>
                </div>

                <!-- Active Navigation Steps -->
                <div id="nav-active" class="hidden flex-grow flex flex-col">
                    <div class="flex items-center justify-between bg-slate-100 p-3 rounded-lg mb-4 font-bold text-slate-600">
                        <span id="nav-progress">Step 1 of X</span>
                        <span id="nav-dest-display" class="text-medical-blue">Destination</span>
                    </div>

                    <div class="flex-grow flex items-center justify-center">
                        <div id="nav-step-display" class="bg-white border-4 border-medical-blue shadow-2xl rounded-2xl p-8 w-full min-h-[250px] flex items-center justify-center text-center relative overflow-hidden" aria-live="polite">
                            <!-- Visual pulse ring -->
                            <div class="absolute inset-0 bg-blue-50 opacity-50"></div>
                            <h3 id="nav-step-text" class="text-4xl sm:text-5xl font-black text-slate-800 leading-tight z-10 relative">
                                <!-- Step text injected here -->
                            </h3>
                        </div>
                    </div>

                    <button type="button" id="nav-next-btn" class="w-full bg-medical-blue text-white text-3xl font-black py-8 rounded-2xl hover:bg-blue-800 focus:ring-[6px] focus:ring-yellow-400 shadow-2xl active:scale-95 transition-all mt-8 mb-4 flex items-center justify-center gap-4">
                        Next Step <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <button type="button" id="nav-repeat-btn" class="w-full bg-slate-200 text-slate-800 text-xl font-bold py-4 rounded-xl hover:bg-slate-300 focus:ring-4 focus:ring-yellow-400 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Repeat Audio
                    </button>
                </div>
            </div>
        </section>

    </main>
    <script src="app.js"></script>
</body>
</html>
